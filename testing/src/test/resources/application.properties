# Configuración exclusiva de tests: no requiere la base del laboratorio.
spring.datasource.url=jdbc:h2:mem:dcabanas;MODE=MariaDB;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# El esquema de test lo genera Hibernate; las migraciones se prueban contra MariaDB.
spring.flyway.enabled=false
